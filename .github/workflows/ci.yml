name: CI / Pull Request Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: Pull Request Hygiene & Commit Quality Gates
  # ============================================================================
  pr-hygiene:
    name: PR Commit Rules (Squash & Message Validation)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase (Full Git History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate PR Commits (Enforce Single Commit & Title+Body Non-Empty)
        run: |
          python3 scripts/validate_pr_commits.py \
            --base "origin/${{ github.base_ref }}" \
            --head "HEAD" \
            --max-commits 1

  # ============================================================================
  # JOB 2: Secret Shielding & Token Leak Prevention
  # ============================================================================
  security-audit:
    name: Secret Shielding Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Scan for Accidental Plaintext Credentials
        run: |
          echo "Scanning repository files for forbidden credential patterns..."
          python3 -c "
          import os, re, sys
          FORBIDDEN_PATTERNS = [
              r'/home/(?:waynechen|gemini_project)',
              r'vertex-ai-206179',
              r'MDA[a-zA-Z0-9+/=]{30,}',
              r'ghp_[a-zA-Z0-9]{36}',
              r'github_pat_[a-zA-Z0-9_]{82}',
              r'glpat-[a-zA-Z0-9\-]{20}',
              r'-----BEGIN PRIVATE KEY-----',
              r'-----BEGIN RSA PRIVATE KEY-----'
          ]
          violations = []
          for root, _, files in os.walk('.'):
              if '.git' in root or '__pycache__' in root:
                  continue
              for f in files:
                  if f.endswith(('.pyc', '.log', '.tmp', '.tar.xz', '.tar.gz')) or f in ('canonical_bridges.py', 'utils.py'):
                      continue
                  p = os.path.join(root, f)
                  try:
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fp:
                          content = fp.read()
                      for pat in FORBIDDEN_PATTERNS:
                          if re.search(pat, content):
                              violations.append(f'{p}: matched {pat}')
                  except Exception:
                      pass
          if violations:
              print('❌ [SECURITY ERROR] Real secrets detected in tracked files:', file=sys.stderr)
              for v in violations:
                  print(f'  - {v}', file=sys.stderr)
              sys.exit(1)
          print('✅ [SECURITY PASSED] Zero hardcoded plain-text secrets detected.')
          "

  # ============================================================================
  # JOB 3: Static Syntax & Python Bytecode Integrity
  # ============================================================================
  syntax-verification:
    name: Bytecode Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify All Python Source Files Compile Cleanly
        run: |
          python3 -c "
          import glob, os, sys
          py_files = glob.glob('*.py') + glob.glob('bridges/*.py') + glob.glob('tests/*.py') + glob.glob('scripts/*.py')
          errors = []
          for f in py_files:
              ret = os.system(f'python3 -m py_compile {f}')
              if ret != 0:
                  errors.append(f)
          if errors:
              print(f'❌ Bytecode compilation failed on: {errors}', file=sys.stderr)
              sys.exit(1)
          print(f'✅ All {len(py_files)} Python source files compiled cleanly!')
          "

  # ============================================================================
  # JOB 4: Automated Test Matrix (Python 3.10, 3.11, 3.12)
  # ============================================================================
  test-matrix:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    needs: [syntax-verification, security-audit]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      HEADLESS: "1"
      DRY_RUN_MODE: "1"
      NODE_EXTRA_CA_CERTS: "/etc/ssl/certs/ca-certificates.crt"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute Complete Test Suite
        run: |
          python3 run_tests.py
